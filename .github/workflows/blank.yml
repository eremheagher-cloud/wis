
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: System Information
      shell: powershell
      run: |
        Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
        Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
        Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
        Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
        Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan
        Get-ComputerInfo |
          Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
        Get-CimInstance Win32_Processor |
          Select-Object Name, NumberOfCores, NumberOfLogicalProcessors
        Write-Host "`n=== ARCHITECTURE ===" -ForegroundColor Cyan
        Write-Host "PROCESSOR_ARCHITECTURE: $env:PROCESSOR_ARCHITECTURE"
        Write-Host "PROCESSOR_ARCHITEW6432: $env:PROCESSOR_ARCHITEW6432"

    - name: Enable RDP
      shell: powershell
      run: |
        Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
          -Name "fDenyTSConnections" `
          -Value 0
        Set-ItemProperty `
          -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name "UserAuthentication" `
          -Value 1
        Enable-NetFirewallRule `
          -DisplayGroup "Remote Desktop" `
          -ErrorAction SilentlyContinue
        Write-Host "Remote Desktop enabled successfully." -ForegroundColor Green

    - name: Create User Account
      shell: powershell
      run: |
        Write-Host "Setting up user accounts..." -ForegroundColor Green
        $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force

        $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
        if ($user) {
          Set-LocalUser -Name "runneradmin" -Password $Password
        } else {
          New-LocalUser -Name "runneradmin" -Password $Password -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword
        }
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue

        $rafael = Get-LocalUser -Name "Rafael" -ErrorAction SilentlyContinue
        if (-not $rafael) {
          Write-Host "Creating Rafael as Administrator..." -ForegroundColor Yellow
          New-LocalUser -Name "Rafael" -Password $Password -AccountNeverExpires -PasswordNeverExpires
          Write-Host "Rafael created." -ForegroundColor Green
        } else {
          Write-Host "Rafael already exists. Updating password..." -ForegroundColor Yellow
          Set-LocalUser -Name "Rafael" -Password $Password
        }
        Add-LocalGroupMember -Group "Administrators" -Member "Rafael" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Rafael" -ErrorAction SilentlyContinue
        Write-Host "Username: Rafael" -ForegroundColor Yellow
        Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

    - name: Prepare Tailscale Dependencies
      shell: powershell
      run: |
        Write-Host "=== PREPARING TAILSCALE DEPENDENCIES ===" -ForegroundColor Green
        $requiredServices = @("Dnscache", "iphlpsvc", "netprofm", "WinHttpAutoProxySvc")
        foreach ($serviceName in $requiredServices) {
          Write-Host "`nChecking service: $serviceName" -ForegroundColor Yellow
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if (-not $service) {
            continue
          }
          if ($service.StartType -eq "Disabled") {
            Set-Service -Name $serviceName -StartupType Automatic -ErrorAction SilentlyContinue
          }
          if ((Get-Service -Name $serviceName).Status -ne "Running") {
            Start-Service -Name $serviceName -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }
          Write-Host "$serviceName final status: $((Get-Service -Name $serviceName).Status)" -ForegroundColor Green
        }

    - name: Install Tailscale
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "=== INSTALLING TAILSCALE ===" -ForegroundColor Green
        $installerPath = "$env:TEMP\tailscale-setup.exe"
        $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4.exe"
        Write-Host "Downloading Tailscale..." -ForegroundColor Yellow
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
        if (-not (Test-Path $installerPath) -or (Get-Item $installerPath).Length -lt 1000000) {
          throw "Invalid Tailscale installer."
        }
        $installProcess = Start-Process -FilePath $installerPath -ArgumentList "/quiet" -Wait -PassThru
        if ($installProcess.ExitCode -ne 0) {
          throw "Tailscale installation failed."
        }
        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscaleExe)) {
          throw "tailscale.exe was not found."
        }
        & $tailscaleExe version

    - name: Start Tailscale - Browser Login
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

        Write-Host "=== STARTING TAILSCALE ===" -ForegroundColor Green

        if (-not (Test-Path $tailscaleExe)) {
          throw "Tailscale executable was not found."
        }

        $service = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
        if (-not $service) {
          throw "Tailscale service was not found."
        }

        if ($service.Status -ne "Running") {
          Start-Service -Name "Tailscale"
          Start-Sleep -Seconds 5
        }

        Write-Host "Starting browser-based authentication..." -ForegroundColor Yellow
        Write-Host "The login link will appear below if Tailscale provides one." -ForegroundColor Yellow

        # Capture native command output without PowerShell stopping on stderr.
        $ErrorActionPreference = 'Continue'
        $loginOutput = @(
          & $tailscaleExe up `
            --hostname="PC-criado-pelo-alves7.pcm" `
            --accept-routes `
            --accept-dns=false 2>&1
        )
        $loginExitCode = $LASTEXITCODE
        $ErrorActionPreference = 'Stop'

        foreach ($item in $loginOutput) {
          $line = $item.ToString()
          Write-Host $line
          if ($line -match '(https://login\.tailscale\.com/[^\s"]+)') {
            Write-Host "LOGIN LINK: $($Matches[1])" -ForegroundColor Cyan
          }
        }

        $deadline = (Get-Date).AddMinutes(10)
        $connected = $false
        $tsIP = $null

        Write-Host "Waiting up to 10 minutes for account authorization..." -ForegroundColor Yellow

        while ((Get-Date) -lt $deadline) {
          $ErrorActionPreference = 'Continue'
          $statusOutput = (& $tailscaleExe status 2>&1 | Out-String)
          $ipOutput = @(& $tailscaleExe ip -4 2>&1)
          $ErrorActionPreference = 'Stop'

          $candidate = ""
          if ($ipOutput.Count -gt 0) {
            $candidate = $ipOutput[0].ToString().Trim()
          }

          if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$' -and
              $statusOutput -notmatch 'NeedsLogin' -and
              $statusOutput -notmatch 'Logged out') {
            $tsIP = $candidate
            $connected = $true
            break
          }

          Start-Sleep -Seconds 5
        }

        if (-not $connected) {
          Write-Host "Tailscale status:" -ForegroundColor Yellow
          $ErrorActionPreference = 'Continue'
          & $tailscaleExe status 2>&1
          $ErrorActionPreference = 'Stop'
          throw "Login was not completed within 10 minutes. Check the URL printed above."
        }

        Write-Host "TAILSCALE CONNECTED - IP: $tsIP" -ForegroundColor Green
        "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Get Tailscale IP
      shell: powershell
      run: |
        $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"
        $tsIP = $null
        for ($i = 1; $i -le 12; $i++) {
          Start-Sleep -Seconds 3
          $ErrorActionPreference = 'Continue'
          $output = @(& $tailscaleExe ip -4 2>&1)
          $ErrorActionPreference = 'Stop'
          $candidate = ""
          if ($output.Count -gt 0) {
            $candidate = $output[0].ToString().Trim()
          }
          if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
            $tsIP = $candidate
            break
          }
        }
        if (-not $tsIP) {
          throw "Unable to obtain Tailscale IPv4 address."
        }
        Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green
        "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

    - name: Install Google Chrome (Direct)
      shell: powershell
      run: |
        $chromeUrl = "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise_arm64.msi"
        $installerPath = "$env:TEMP\chrome_installer.msi"
        Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath -UseBasicParsing
        Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /qn /norestart" -Wait
        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

    - name: Install 7-Zip (Direct)
      shell: powershell
      run: |
        $zipUrl = "https://www.7-zip.org/a/7z2501-arm64.exe"
        $installerPath = "$env:TEMP\7z-installer.exe"
        Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath -UseBasicParsing
        Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
        Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

    - name: Connection Details
      shell: powershell
      run: |
        Write-Host "`n=== CONNECTION DETAILS (TAILSCALE) ===" -ForegroundColor Green
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "        ENIGMANO RDP ACCESS" -ForegroundColor Cyan
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "Host: $env:TAILSCALE_IP" -ForegroundColor White
        Write-Host "Username: Rafael" -ForegroundColor White
        Write-Host "Password: P@ssw0rd!" -ForegroundColor White
        Write-Host "========================================" -ForegroundColor Cyan
        Write-Host "1. Install Tailscale on your device." -ForegroundColor White
        Write-Host "2. Connect to the same Tailscale account." -ForegroundColor White
        Write-Host "3. Open Remote Desktop." -ForegroundColor White
        Write-Host "4. Enter the Tailscale IP." -ForegroundColor White
        Write-Host "5. Username: Rafael" -ForegroundColor White
        Write-Host "6. Password: P@ssw0rd!" -ForegroundColor White

    - name: Keep Session Alive
      shell: powershell
      run: |
        Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
        Write-Host "Instance will remain active for up to 6 hours." -ForegroundColor Yellow
        $counter = 0
        while ($true) {
          $counter++
          Write-Host "Session active - Heartbeat #$counter ($(Get-Date))" -ForegroundColor Green
          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          $ErrorActionPreference = 'Continue'
          $ipOutput = @(& $tailscaleExe ip -4 2>&1)
          $ErrorActionPreference = 'Stop'

          $tsIP = ""
          if ($ipOutput.Count -gt 0) {
            $tsIP = $ipOutput[0].ToString().Trim()
          }

          if ($tsIP -match '^\d{1,3}(\.\d{1,3}){3}$') {
            Write-Host "Tailscale IP: $tsIP" -ForegroundColor Cyan
          } else {
            Write-Host "Tailscale disconnected. Check Tailscale login status." -ForegroundColor Yellow
            $ErrorActionPreference = 'Continue'
            & $tailscaleExe status 2>&1
            $ErrorActionPreference = 'Stop'
          }

          Start-Sleep -Seconds 60
        }
        
